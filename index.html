<style>

*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 10%,#1c2350 0,#090b1b 55%,#060712 100%);font-family:system-ui,-apple-system,'Microsoft JhengHei',sans-serif;color:#f6f5ff;display:flex;align-items:center;justify-content:center;padding:18px}
.shell{width:min(1100px,100%)}.top{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:12px;flex-wrap:wrap}.logo{font-size:clamp(22px,3.4vw,37px);font-weight:1000;letter-spacing:.12em;color:#fff;text-shadow:3px 3px #d93388,6px 6px #253a9b}.sub{font-size:11px;letter-spacing:.3em;color:#8bdde9;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}button{cursor:pointer;touch-action:manipulation} .btn{border:1px solid #57638e;background:#192143;color:#eef7ff;padding:9px 14px;border-radius:8px;font-weight:800;font-size:13px}.btn:hover,.btn:focus-visible{border-color:var(--cyan);background:#253567;outline:none}.btn.primary{background:#b92c79;border-color:#ff68b3}.screen{position:relative;border:3px solid #5a65ac;box-shadow:0 0 0 3px #0c1236,0 18px 55px #0009,0 0 25px #5b45a544;aspect-ratio:16/9;overflow:hidden;background:#091329;border-radius:5px}canvas{display:block;width:100%;height:100%;image-rendering:auto}.screen::after{content:"";pointer-events:none;position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0px,#0000 3px,#0002 4px);opacity:.38}.status{position:absolute;top:47%;left:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;display:none;filter:drop-shadow(0 5px 0 #10132b)}.status.show{display:block}.status h2{font-size:clamp(28px,5.5vw,76px);margin:0;color:#fff;text-shadow:4px 4px #f14094,8px 8px #30338b;line-height:1.1;white-space:nowrap}.status p{font-size:clamp(12px,1.8vw,20px);font-weight:900;color:#ffe89c;letter-spacing:.2em}.help{margin-top:15px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.help article{border:1px solid #384066;border-radius:8px;padding:12px 14px;background:#10172d}.help strong{color:#84f0ff}.help article:last-child strong{color:#ff80b1}.help p{margin:5px 0 0;color:#c4c9df;font-size:13px;line-height:1.8}.key{display:inline-block;border:1px solid #536086;background:#263052;border-bottom:3px solid #455077;padding:0 5px;border-radius:4px;font-weight:800;color:#fff;min-width:20px;text-align:center}.footer{font-size:12px;color:#8991b2;text-align:center;margin-top:11px}.touch{display:none;justify-content:space-between;gap:8px;margin-top:12px;align-items:end}.touchGroup{display:flex;gap:7px;align-items:end}.touch button{border-radius:10px;background:#283358;color:#fff;border:2px solid #6978ac;min-width:54px;height:54px;font-weight:900;font-size:15px;user-select:none;-webkit-user-select:none}.touch button:active,.touch button.on{background:#bb347d;border-color:#ff90c1}.touch .attack{background:#58305c}.touch .up{margin-bottom:34px}@media(pointer:coarse),(max-width:720px){body{padding:9px;align-items:start}.touch{display:flex}.help{grid-template-columns:1fr}.touch button{min-width:45px;height:50px}.top{align-items:start}.actions .btn{padding:8px}.logo{font-size:25px}}@media(max-width:390px){.touch button{min-width:39px;padding:0 4px}.touchGroup{gap:4px}}

<body><div class="shell">
<header class="top"><div><div class="sub">RETRO ARCADE · 199X EDITION</div><div class="logo">⚡ 霓虹對決</div></div><div class="actions"><button class="btn" id="modeBtn">模式：挑戰電腦</button><button class="btn" id="soundBtn">🔊 音效：開</button><button class="btn primary" id="restartBtn">↻ 重新開局</button></div></header>
<div class="screen" id="screen"><canvas id="game" width="960" height="540" role="img" aria-label="兩位像素風格格鬥角色在霓虹城市街道對戰。使用下方說明操作。"></canvas><div class="status" id="overlay"><h2 id="overlayTitle"></h2><p id="overlayDesc"></p></div></div>
<div class="touch" aria-label="觸控遊戲按鍵"><div class="touchGroup"><button data-key="KeyA" aria-label="左移">◀</button><button data-key="KeyW" aria-label="跳躍" class="up">▲</button><button data-key="KeyD" aria-label="右移">▶</button><button data-key="KeyS" aria-label="防禦">盾</button></div><div class="touchGroup"><button class="attack" data-key="KeyF">拳</button><button class="attack" data-key="KeyG">踢</button><button class="attack" data-key="KeyH">波</button></div></div>
<section class="help"><article><strong>🥊 玩家 1 · 赤焰</strong><p>移動 <span class="key">A</span> <span class="key">D</span> · 跳躍 <span class="key">W</span> · 防禦 <span class="key">S</span><br>出拳 <span class="key">F</span> · 踢擊 <span class="key">G</span> · 能量波 <span class="key">H</span>（消耗能量）</p></article><article><strong>⚡ 玩家 2 · 蒼雷</strong><p>移動 <span class="key">←</span> <span class="key">→</span> · 跳躍 <span class="key">↑</span> · 防禦 <span class="key">↓</span><br>出拳 <span class="key">J</span> · 踢擊 <span class="key">K</span> · 能量波 <span class="key">L</span>（雙人模式）</p></article></section>
<div class="footer">先贏得 2 回合獲勝 · 防禦可減少傷害 · 普通攻擊累積能量 · 按 Enter 可重新開局 / 下一場</div>
</div>
<script>
(()=>{
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const overlay=document.querySelector('#overlay'),oTitle=document.querySelector('#overlayTitle'),oDesc=document.querySelector('#overlayDesc');
const W=960,H=540,FLOOR=448,keys=new Set();
let cpuMode=true,sound=true,audio=null,round=1,phase='intro',timer=90,roundClock=0,phaseClock=0,matchWinner=-1,frame=0,last=0,particles=[],projectiles=[],shakes=0,flash=0,players=[];
const random=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function tone(freq=200,dur=.08,type='square',gain=.045,slide=0){if(!sound)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),t+dur);g.gain.setValueAtTime(gain,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+dur+.01)}catch(e){}}
function makePlayer(i){return {i,x:i?735:225,y:FLOOR,vx:0,vy:0,face:i?-1:1,hp:100,energy:30,wins:0,atk:'',atkTime:0,atkHit:false,cool:0,hurt:0,block:false,combo:0,comboT:0,aiThink:0,aiAction:'',blink:0};}
function startMatch(){players=[makePlayer(0),makePlayer(1)];round=1;matchWinner=-1;beginRound();}
function beginRound(){let wins=players.map(p=>p.wins);players=[makePlayer(0),makePlayer(1)];players.forEach((p,i)=>p.wins=wins[i]);projectiles=[];particles=[];timer=90;roundClock=0;phase='intro';phaseClock=1.65;show(`ROUND ${round}`,'準備戰鬥！');}
function show(t,s){oTitle.textContent=t;oDesc.textContent=s;overlay.classList.add('show');}function hide(){overlay.classList.remove('show');}
function attack(p,type){if(phase!=='fight'||p.hurt>0||p.atkTime>0||p.cool>0)return;if(type==='special'&&p.energy<35)return;let d=type==='punch'?.23:type==='kick'?.35:.46;p.atk=type;p.atkTime=d;p.atkHit=false;p.cool=d+.11;if(type==='special'){p.energy-=35;tone(165,.24,'sawtooth',.05,430)}else tone(type==='punch'?230:130,.07,'square',.035,-85);}
function effect(x,y,col,n=11){for(let j=0;j<n;j++)particles.push({x,y,vx:random(-230,230),vy:random(-235,100),life:random(.14,.42),max:.42,r:random(2,7),color:col});}
function hit(src,target,damage,knock,high=true){if(target.hurt>0.02)return;let blocked=target.block&&target.y>=FLOOR-1;let d=blocked?Math.ceil(damage*.18):damage;target.hp=Math.max(0,target.hp-d);target.energy=clamp(target.energy+(blocked?5:9),0,100);src.energy=clamp(src.energy+(blocked?3:12),0,100);target.hurt=blocked?.10:.30;target.vx=src.face*(blocked?knock*.35:knock);if(!blocked){target.vy=high?-115:-35;src.combo++;src.comboT=1.7;}effect((src.x+target.x)/2,target.y-92,blocked?'#b4eaff':'#ffe18a',blocked?7:19);shakes=blocked?3:9;flash=blocked?0:.055;tone(blocked?165:75,blocked?.07:.16,blocked?'triangle':'sawtooth',.075,blocked?-50:-55);if(target.hp===0)endRound();}
function endRound(){if(phase!=='fight')return;phase='result';phaseClock=2.75;let winner=players[0].hp===players[1].hp?-1:(players[0].hp>players[1].hp?0:1);if(winner>=0){players[winner].wins++;show(winner===0?'赤焰勝利！':'蒼雷勝利！',`第 ${round} 回合結束`);}else show('平手！','勢均力敵');if(winner>=0&&players[winner].wins>=2){phase='matchover';matchWinner=winner;show(winner===0?'赤焰稱霸！':'蒼雷稱霸！','🏆 勝出整場比賽 · 按 Enter 再戰');}else{tone(430,.2,'triangle',.07,230);}}
function spawnProjectile(p){let color=p.i===0?'#ffb64c':'#74e9ff';projectiles.push({x:p.x+p.face*61,y:p.y-93,vx:p.face*480,owner:p.i,life:1.6,r:22,color});effect(p.x+p.face*42,p.y-94,color,12);}
function input(p){if(p.i===1&&cpuMode){p.aiThink-=1/60;if(p.aiThink<=0){let e=players[0],dist=Math.abs(e.x-p.x);p.aiThink=random(.13,.32);p.aiAction=dist>135?'approach':dist<73?'retreat':'stand';if(dist<130&&Math.random()<.69)attack(p,Math.random()<.57?'punch':'kick');else if(dist<440&&p.energy>=35&&Math.random()<.23)attack(p,'special');if(e.atkTime>0&&dist<145&&Math.random()<.55)p.aiAction='guard';if(Math.random()<.07&&p.y>=FLOOR)p.vy=-590;}
let e=players[0],dir=e.x>p.x?1:-1;p.block=p.aiAction==='guard'&&p.y>=FLOOR;if(!p.block&&p.hurt<=0){if(p.aiAction==='approach')p.vx=dir*190;else if(p.aiAction==='retreat')p.vx=-dir*120;else p.vx*=.74;}return;}
let left=keys.has(p.i?'ArrowLeft':'KeyA'),right=keys.has(p.i?'ArrowRight':'KeyD'),up=keys.has(p.i?'ArrowUp':'KeyW'),down=keys.has(p.i?'ArrowDown':'KeyS');p.block=down&&p.y>=FLOOR&&p.atkTime<=0;if(p.hurt<=0&&!p.block){p.vx=((right?1:0)-(left?1:0))*270;if(up&&p.y>=FLOOR-.1){p.vy=-615;tone(310,.09,'triangle',.02,80)}}else if(p.block)p.vx=0;}
function update(dt){frame+=dt;for(let p of players){p.blink+=dt;p.cool=Math.max(0,p.cool-dt);p.hurt=Math.max(0,p.hurt-dt);p.atkTime=Math.max(0,p.atkTime-dt);p.comboT-=dt;if(p.comboT<=0)p.combo=0;}
particles=particles.filter(a=>(a.life-=dt)>0);for(let a of particles){a.x+=a.vx*dt;a.y+=a.vy*dt;a.vy+=550*dt;}
shakes=Math.max(0,shakes-45*dt);flash=Math.max(0,flash-dt);
if(phase==='intro'){phaseClock-=dt;if(phaseClock<=0){phase='fight';hide();show('FIGHT!','');phaseClock=.55;}return;}
if(phase==='result'){phaseClock-=dt;if(phaseClock<=0){round++;beginRound();}return;}
if(phase==='matchover')return;
if(phaseClock>0){phaseClock-=dt;if(phaseClock<=0)hide();}
roundClock+=dt;if(roundClock>=1){roundClock-=1;timer--;if(timer<=0){endRound();return;}}
players.forEach(p=>{p.face=players[1-p.i].x>=p.x?1:-1;input(p);p.vy+=1600*dt;p.x=clamp(p.x+p.vx*dt,42,W-42);p.y=Math.min(FLOOR,p.y+p.vy*dt);if(p.y>=FLOOR)p.vy=0;});
// Keep characters from occupying exactly the same space.
let [a,b]=players;if(Math.abs(a.x-b.x)<66){let m=(a.x+b.x)/2;a.x=clamp(m-33,42,W-42);b.x=clamp(m+33,42,W-42);}
for(let p of players){if(!p.atk||p.atkTime<=0){p.atk='';continue;}let elapsed=(p.atk==='punch'?.23:p.atk==='kick'?.35:.46)-p.atkTime;
if(p.atk==='special'&&!p.atkHit&&elapsed>.19){spawnProjectile(p);p.atkHit=true;}
if(p.atk!=='special'&&!p.atkHit&&elapsed>(p.atk==='punch'?.08:.13)){let e=players[1-p.i],dist=Math.abs(e.x-p.x),reach=p.atk==='punch'?109:142;if(dist<reach&&Math.abs(p.y-e.y)<105&&p.face*(e.x-p.x)>0){hit(p,e,p.atk==='punch'?9:15,p.atk==='punch'?195:270);p.atkHit=true;}}}
projectiles=projectiles.filter(pr=>{pr.x+=pr.vx*dt;pr.life-=dt;let e=players[1-pr.owner];if(Math.abs(pr.x-e.x)<46&&Math.abs(pr.y-(e.y-93))<72){hit(players[pr.owner],e,18,310);effect(pr.x,pr.y,pr.color,23);return false;}return pr.life>0&&pr.x>-50&&pr.x<W+50;});
}
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(x,y,w,h)}
function line(x1,y1,x2,y2,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function polygon(pts,c){ctx.fillStyle=c;ctx.beginPath();pts.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fill();}
function background(){let sky=ctx.createLinearGradient(0,0,0,460);sky.addColorStop(0,'#0b0e29');sky.addColorStop(.55,'#242052');sky.addColorStop(1,'#9b386e');rect(0,0,W,450,sky);
// electric moon
ctx.beginPath();ctx.arc(763,115,60,0,Math.PI*2);ctx.fillStyle='#ff8cb9';ctx.shadowColor='#ff629f';ctx.shadowBlur=45;ctx.fill();ctx.shadowBlur=0;for(let j=0;j<9;j++){let yy=75+j*10;rect(707,yy,112,random(1,2),'#2e2656');}
for(let l=0;l<2;l++){let speed=l?.16:.07;for(let j=0;j<23;j++){let x=(j*81+13+(l?38:0)),h=80+(j*73%130),y=374-h;rect(x,y,l?69:55,h,l?'#151933':'#202449');for(let k=0;k<5;k++)for(let m=0;m<7;m++){if((k*13+m*7+j)%4!==0)rect(x+7+k*11,y+10+m*18,4,6,l?'#7f568e':'#6a487e');}}}
rect(0,360,960,88,'#151a36');for(let i=0;i<10;i++){let x=i*103+12;rect(x,347,5,96,'#373b65');rect(x-8,341,22,7,'#283152');}
// storefronts
rect(14,272,176,92,'#202442');rect(28,290,144,49,'#0d1935');rect(32,294,136,41,'#152c56');rect(29,278,144,10,'#ad327f');ctx.font='bold 24px monospace';ctx.textAlign='center';ctx.fillStyle='#ff83d1';ctx.shadowColor='#ff45ad';ctx.shadowBlur=13;ctx.fillText('ARCADE',102,320);ctx.shadowBlur=0;
rect(374,284,176,79,'#1a203b');rect(393,297,135,36,'#0d1d40');ctx.font='bold 18px monospace';ctx.fillStyle='#81edff';ctx.shadowColor='#38e4ff';ctx.shadowBlur=12;ctx.fillText('NEON CITY',460,323);ctx.shadowBlur=0;
// floor
let ground=ctx.createLinearGradient(0,FLOOR,0,H);ground.addColorStop(0,'#303457');ground.addColorStop(1,'#13172c');rect(0,FLOOR,960,92,ground);rect(0,FLOOR,960,5,'#ff589a');for(let i=0;i<17;i++){let x=i*67;line(x,540,480+(x-480)*.66,FLOOR,'#3e3d6c',1);}for(let y=466;y<540;y+=22){line(0,y,960,y,'#45416c',1);}rect(0,439,960,9,'#11182b');for(let i=0;i<30;i++)rect(i*34,444,15,3,'#9f6398');
// floating particles in atmosphere
for(let i=0;i<22;i++){let x=(i*211+Math.sin(frame*.45+i)*9)%960,y=42+(i*93)%300;rect(x,y,2,2,i%2?'#8ae7ff80':'#ff89c080');}
}
function drawFighter(p){ctx.save();ctx.translate(Math.round(p.x),Math.round(p.y));ctx.scale(p.face,1);let move=Math.abs(p.vx)>55&&p.y>=FLOOR,walk=move?Math.sin(frame*15):0,damaged=p.hurt>0;let main=p.i===0?'#dd3f51':'#3387e2',dark=p.i===0?'#862849':'#214a92',light=p.i===0?'#ff9376':'#84e2ff',skin=p.i===0?'#e5ae82':'#cf9b78',hair=p.i===0?'#35283b':'#e4ecff';let punching=p.atk==='punch'&&p.atkTime>0,kicking=p.atk==='kick'&&p.atkTime>0,special=p.atk==='special'&&p.atkTime>0;
if(damaged&&Math.floor(frame*30)%2===0)ctx.globalAlpha=.6;
// ground shadow
ctx.fillStyle='#080d24aa';ctx.beginPath();ctx.ellipse(0,0,53,11,0,0,7);ctx.fill();
ctx.translate(0,p.y<FLOOR?0:Math.sin(frame*4)*1.4);
// rear leg
line(-16,-63,-24+walk*11,-31,dark,23);line(-24+walk*11,-31,-27+walk*15,-7,main,21);rect(-47+walk*15,-16,37,15,'#0a1630');
// main leg and strike
if(kicking){line(16,-64,45,-52,main,25);line(45,-52,110,-57,main,22);polygon([[94,-70],[132,-65],[137,-49],[96,-44]],'#121b38');}else{line(14,-66,19-walk*10,-34,main,25);line(19-walk*10,-34,27-walk*16,-10,dark,22);rect(11-walk*16,-17,41,16,'#111b38');}
// torso
polygon([[-27,-130],[24,-130],[33,-64],[-28,-64]],main);polygon([[-7,-130],[11,-130],[9,-77],[-10,-77]],light);rect(-29,-83,63,11,dark);rect(-10,-83,24,11,p.i===0?'#ffe49c':'#c8f6ff');
// back arm
line(-23,-116,-38,-88,dark,19);line(-38,-88,-19,-78,skin,18);rect(-28,-90,20,20,p.i===0?'#7a2548':'#203a81');
// forward arm
if(p.block){line(20,-120,38,-104,skin,21);line(38,-104,25,-143,skin,19);rect(14,-155,25,24,dark);}else if(punching||special){line(22,-118,51,-108,skin,22);line(51,-108,special?63:99,-111,skin,20);rect(special?58:94,-124,25,25,dark);}else{line(24,-118,42,-89,skin,21);line(42,-89,22,-80,skin,19);rect(12,-91,27,24,dark);}
// head neck hair
rect(-11,-148,23,20,skin);ctx.fillStyle=skin;ctx.beginPath();ctx.roundRect(-22,-175,44,43,9);ctx.fill();polygon([[-23,-164],[-19,-185],[4,-197],[24,-182],[24,-166],[13,-178],[-3,-174],[-12,-178]],hair);rect(12,-162,11,5,'#15182a');rect(15,-161,5,3,'#fff');
if(p.i===0){rect(-26,-177,50,7,'#f1db68');rect(14,-176,16,9,'#f1db68');}else{rect(-21,-179,44,7,'#203a75');rect(-31,-172,16,6,'#89ddff');}
ctx.restore();}
function drawBars(){rect(22,19,390,38,'#0c1330');rect(548,19,390,38,'#0c1330');rect(28,25,378,25,'#6b2449');rect(554,25,378,25,'#263f73');let a=players[0],b=players[1];rect(28,25,378*a.hp/100,25,a.hp>25?'#ff667d':'#ffb55a');rect(932-378*b.hp/100,25,378*b.hp/100,25,b.hp>25?'#66d9ff':'#ffb55a');ctx.strokeStyle='#f7e5db';ctx.lineWidth=3;ctx.strokeRect(26,23,382,29);ctx.strokeRect(552,23,382,29);
ctx.textAlign='left';ctx.font='900 20px monospace';ctx.fillStyle='#fff';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText('赤焰  RYU',30,80);ctx.textAlign='right';ctx.fillText('蒼雷  KAI',930,80);ctx.shadowBlur=0;
rect(28,89,230,12,'#121631');rect(28,89,230*a.energy/100,12,'#ffe07d');rect(702,89,230,12,'#121631');rect(932-230*b.energy/100,89,230*b.energy/100,12,'#70e9fe');
ctx.strokeStyle='#65759c';ctx.lineWidth=2;ctx.strokeRect(28,89,230,12);ctx.strokeRect(702,89,230,12);
rect(435,17,90,70,'#101530');ctx.strokeStyle='#ffe3a0';ctx.lineWidth=3;ctx.strokeRect(435,17,90,70);ctx.fillStyle='#ffebad';ctx.textAlign='center';ctx.font='900 44px monospace';ctx.fillText(String(timer).padStart(2,'0'),480,69);
for(let i=0;i<2;i++){ctx.fillStyle=i<a.wins?'#ffd76e':'#293452';ctx.beginPath();ctx.arc(35+i*25,119,8,0,Math.PI*2);ctx.fill();ctx.fillStyle=i<b.wins?'#ffd76e':'#293452';ctx.beginPath();ctx.arc(925-i*25,119,8,0,Math.PI*2);ctx.fill();}
if(a.combo>=2&&a.comboT>0){ctx.font='bold 24px monospace';ctx.fillStyle='#ffdf88';ctx.textAlign='left';ctx.fillText(`${a.combo} HIT COMBO!`,34,177);}if(b.combo>=2&&b.comboT>0){ctx.font='bold 24px monospace';ctx.fillStyle='#90f1ff';ctx.textAlign='right';ctx.fillText(`${b.combo} HIT COMBO!`,926,177);}
}
function render(){ctx.save();if(shakes>0)ctx.translate(random(-shakes,shakes),random(-shakes,shakes));background();projectiles.forEach(pr=>{ctx.fillStyle=pr.color;ctx.shadowColor=pr.color;ctx.shadowBlur=26;ctx.beginPath();ctx.arc(pr.x,pr.y,pr.r+Math.sin(frame*25)*3,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pr.x,pr.y,9,0,7);ctx.fill();ctx.shadowBlur=0;for(let i=0;i<5;i++)rect(pr.x-Math.sign(pr.vx)*i*17,pr.y+Math.sin(frame*18+i)*10,9,4,pr.color)});players.forEach(drawFighter);particles.forEach(a=>{ctx.globalAlpha=clamp(a.life/a.max,0,1);rect(a.x,a.y,a.r,a.r,a.color)});ctx.globalAlpha=1;drawBars();if(flash>0)rect(0,0,W,H,'#ffffff22');ctx.restore();}
function loop(t){if(!last)last=t;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);render();requestAnimationFrame(loop);}
const map={'KeyF':'punch','KeyG':'kick','KeyH':'special','KeyJ':'punch','KeyK':'kick','KeyL':'special'};
window.addEventListener('keydown',e=>{let gameKeys=['KeyW','KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyJ','KeyK','KeyL','Enter'];if(gameKeys.includes(e.code)){e.preventDefault();if(!keys.has(e.code)){if(e.code==='Enter'&&(phase==='matchover'||phase==='result'))startMatch();else if(map[e.code]&&phase==='fight')attack(players['JKL'.includes(e.code.slice(-1))?1:0],map[e.code]);}keys.add(e.code);}});window.addEventListener('keyup',e=>keys.delete(e.code));window.addEventListener('blur',()=>keys.clear());
const modeBtn=document.querySelector('#modeBtn');modeBtn.addEventListener('click',()=>{cpuMode=!cpuMode;modeBtn.textContent=cpuMode?'模式：挑戰電腦':'模式：雙人對戰';startMatch();});document.querySelector('#soundBtn').addEventListener('click',e=>{sound=!sound;e.currentTarget.textContent=sound?'🔊 音效：開':'🔇 音效：關';if(sound)tone(520,.08);});document.querySelector('#restartBtn').addEventListener('click',startMatch);
document.querySelectorAll('[data-key]').forEach(btn=>{let code=btn.dataset.key;const down=e=>{e.preventDefault();if(!keys.has(code)&&map[code])attack(players[0],map[code]);keys.add(code);btn.classList.add('on');try{btn.setPointerCapture(e.pointerId);}catch(_){}};const up=e=>{e.preventDefault();keys.delete(code);btn.classList.remove('on');};btn.addEventListener('pointerdown',down);btn.addEventListener('pointerup',up);btn.addEventListener('pointercancel',up);btn.addEventListener('lostpointercapture',up);});
startMatch();requestAnimationFrame(loop);
})();
</script></body></html>
